<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>도이치 루틴</title>
<link rel="icon" type="image/svg+xml" href="./favicon-mark.svg">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
<link rel="shortcut icon" href="./favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="manifest" href="./site.webmanifest">
<meta name="theme-color" content="#17150F">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap');

:root{
  --paper:#F6F6F3; --paper-2:#ECECE7; --card:#FFFFFF;
  --ink:#17150F; --ink-soft:#57523F; --line:#DEDDD3;
  --gold:#C68A1E; --gold-soft:#F5E3B8; --gold-strong:#8A5E12;
  --red:#C8102E; --red-soft:#F7DEE3;
  --green:#3C6E47; --green-soft:#DCE7DD;
  --shadow:0 2px 10px rgba(23,21,15,0.07);
  --radius:14px;
}
*{box-sizing:border-box;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;} }
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Open Sans',system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent;}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding:16px 16px 48px;}

.auth-gate{position:fixed;inset:0;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:20px;z-index:999;}
.auth-card{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:32px 24px;text-align:center;}
.auth-title{font-size:19px;font-weight:800;color:var(--ink);margin-bottom:6px;}
.auth-sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:20px;line-height:1.5;}
.auth-card input{width:100%;border:1px solid var(--line);border-radius:9px;padding:12px 13px;font-family:inherit;font-size:14px;background:var(--paper);color:var(--ink);margin-bottom:10px;}
.auth-card button{width:100%;border:none;background:var(--ink);color:#FFCB3D;font-weight:700;border-radius:10px;padding:12px;font-size:14px;cursor:pointer;font-family:'Open Sans',sans-serif;min-height:46px;}
#auth-status{margin-top:12px;font-size:12.5px;color:var(--ink-soft);line-height:1.5;min-height:16px;}
.logout-btn{width:100%;border:1px solid var(--line);background:transparent;color:var(--ink-soft);font-size:12.5px;border-radius:9px;padding:10px;cursor:pointer;margin-top:6px;font-family:'Open Sans',sans-serif;}

header{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:6px 2px 14px;margin-bottom:6px;}
.brand-title{font-size:16.5px;font-weight:800;letter-spacing:0.01em;}
.brand-sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
.header-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
.lang-toggle{display:flex;border:1px solid var(--ink);border-radius:999px;overflow:hidden;font-family:'Open Sans',sans-serif;font-size:11px;}
.lang-toggle button{border:none;background:transparent;padding:6px 12px;cursor:pointer;color:var(--ink);font-family:inherit;}
.lang-toggle button.active{background:var(--ink);color:var(--paper);}
.header-icons{display:flex;gap:6px;align-items:center;}
.icon-btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:6px 9px;font-size:13px;cursor:pointer;}
.streak{font-family:'Open Sans',sans-serif;font-size:11.5px;color:var(--ink-soft);white-space:nowrap;}
.streak b{color:var(--ink);}

.level-row{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 16px;border-bottom:1px solid var(--line);margin-bottom:16px;}
.level-pill{flex:0 0 auto;font-family:'Open Sans',sans-serif;font-size:12px;border:1px solid var(--ink);border-radius:8px;padding:6px 11px;background:var(--card);cursor:pointer;white-space:nowrap;}
.level-pill.active{background:var(--ink);color:var(--paper);}
.level-pill small{display:block;font-family:'Open Sans',sans-serif;font-size:9.5px;color:inherit;opacity:0.75;margin-top:1px;}

.mission-hero{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:18px;position:relative;box-shadow:var(--shadow);}
.mission-hero-top{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.mission-chip{width:42px;height:42px;border-radius:12px;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.mission-hero .eyebrow{font-family:'Open Sans',sans-serif;font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold-strong);font-weight:700;}
.mission-hero h2{margin:2px 0 0;font-size:19px;color:var(--ink);font-weight:700;}
.mission-hero p{margin:0 0 14px;font-size:12.5px;color:var(--ink-soft);line-height:1.5;}
.mission-progress{display:flex;gap:5px;margin-bottom:12px;}
.mission-progress span{flex:1;height:6px;border-radius:3px;background:var(--paper-2);}
.mission-progress span.done{background:var(--gold-strong);}
.mission-hero button{width:100%;border:none;background:var(--ink);color:#FFCB3D;font-weight:700;border-radius:10px;padding:12px;font-size:14.5px;cursor:pointer;font-family:'Open Sans',sans-serif;}

.board{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:6px;margin-bottom:20px;box-shadow:var(--shadow);}
.board-caption{font-family:'Open Sans',sans-serif;font-size:10px;letter-spacing:0.16em;color:var(--ink-soft);text-transform:uppercase;padding:10px 12px 6px;}
.board-row{display:flex;align-items:center;gap:14px;padding:16px 12px;border-radius:9px;cursor:pointer;transition:background 0.15s ease;}
.board-row:active{background:var(--gold-soft);}
.board-emoji{font-size:27px;line-height:1;min-width:32px;text-align:center;}
.board-name{flex:1;font-family:'Open Sans',sans-serif;font-size:17px;letter-spacing:0.01em;color:var(--ink);font-weight:700;}
.board-name small{display:block;font-family:'Open Sans',sans-serif;letter-spacing:0;font-size:12.5px;color:var(--ink-soft);font-weight:400;margin-top:2px;}
.board-dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
.board-dot.done{background:var(--green);}
.board-chevron{color:var(--ink-soft);font-size:16px;font-weight:700;}
.board-row + .board-row{border-top:1px solid var(--line);}

.module{display:none;}
.module.active{display:block;animation:fadeIn 0.2s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
.module-header{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.back-btn{font-family:'Open Sans',sans-serif;font-size:12px;background:none;border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;color:var(--ink);}
.module-title{font-size:18px;font-weight:700;flex:1;}
.module-title small{display:block;font-weight:400;font-size:12px;color:var(--ink-soft);margin-top:1px;}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);}
.pill-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px;}
.pill{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 13px;font-size:13px;cursor:pointer;color:var(--ink);}
.pill:active{transform:scale(0.97);}
.pill.selected{background:var(--accent);color:#fff;border-color:var(--accent);}

.btn{font-family:'Open Sans',sans-serif;font-weight:600;font-size:14px;border:none;border-radius:10px;padding:12px 16px;cursor:pointer;width:100%;color:#fff;background:var(--accent);}
.btn:disabled{opacity:0.5;}
.btn.ghost{background:transparent;border:1px solid var(--ink);color:var(--ink);}
.btn-row{display:flex;gap:8px;}
.btn-row .btn{width:auto;flex:1;}

.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;}
.bubble{max-width:88%;padding:11px 13px;border-radius:13px;font-size:14.5px;line-height:1.5;}
.bubble.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:3px;}
.bubble.ai{align-self:flex-start;background:var(--paper-2);border-bottom-left-radius:3px;}
.bubble .replay-btn{margin-top:6px;background:none;border:none;font-size:12px;color:var(--ink-soft);cursor:pointer;padding:0;font-family:'Open Sans',sans-serif;}
.correction-note{align-self:flex-start;max-width:88%;background:var(--red-soft);border-left:3px solid var(--red);padding:9px 11px;border-radius:8px;font-size:12.5px;line-height:1.5;color:#5c1420;}

.mic-zone{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 0 6px;}
.mic-btn{width:64px;height:64px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,0.15);}
.mic-btn.recording{animation:pulse 1.1s infinite;background:var(--red);}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(200,16,46,0.45);}70%{box-shadow:0 0 0 16px rgba(200,16,46,0);}100%{box-shadow:0 0 0 0 rgba(200,16,46,0);}}
.mic-label{font-size:12px;color:var(--ink-soft);font-family:'Open Sans',sans-serif;}
.text-fallback{display:flex;gap:8px;margin-top:8px;}
.text-fallback input{flex:1;border:1px solid var(--line);border-radius:8px;padding:10px 11px;font-family:inherit;font-size:14px;background:var(--paper);color:var(--ink);}
.text-fallback button{border:none;background:var(--ink);color:var(--paper);border-radius:8px;padding:0 14px;cursor:pointer;font-size:13px;}

textarea.write-area{width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;padding:12px;font-family:'Open Sans',sans-serif;font-size:15px;line-height:1.6;background:var(--paper);color:var(--ink);resize:vertical;}
.word-count{font-family:'Open Sans',sans-serif;font-size:11px;color:var(--ink-soft);text-align:right;margin-top:5px;}

.passage{font-family:'Open Sans',sans-serif;font-size:16px;line-height:1.75;color:var(--ink);}
.passage b.vocab-hit{background:var(--accent-soft,var(--gold-soft));border-radius:3px;padding:0 2px;cursor:pointer;font-weight:600;}
.vocab-def{display:none;font-size:12.5px;background:var(--paper-2);border-radius:6px;padding:8px 10px;margin-top:6px;line-height:1.5;}
.vocab-def.show{display:block;}

.qa{border-top:1px solid var(--line);padding-top:12px;margin-top:14px;}
.q-block{margin-bottom:14px;}
.q-text{font-size:14.5px;font-weight:600;margin-bottom:8px;}
.opt{display:block;border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:7px;font-size:13.5px;cursor:pointer;background:var(--paper);}
.opt.picked{border-color:var(--ink);background:var(--paper-2);}
.opt.correct{border-color:var(--green);background:var(--green-soft);}
.opt.wrong{border-color:var(--red);background:var(--red-soft);}

.section-label{font-family:'Open Sans',sans-serif;font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px;}
.feedback-block{margin-top:10px;}
.feedback-block h4{font-size:12.5px;margin:0 0 5px;font-family:'Open Sans',sans-serif;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-soft);}
.feedback-block p, .feedback-block li{font-size:14px;line-height:1.6;}
.feedback-block ul{padding-left:18px;margin:0;}
.corrected-box{font-family:'Open Sans',sans-serif;font-size:15px;line-height:1.65;background:var(--paper-2);border-radius:9px;padding:12px;}
.level-badge{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;padding:3px 11px;font-size:12px;font-family:'Open Sans',sans-serif;margin-top:4px;}

.audio-controls{display:flex;gap:8px;justify-content:center;margin-bottom:6px;}
.audio-controls button{border:1px solid var(--ink);background:transparent;border-radius:9px;padding:9px 14px;font-size:13px;cursor:pointer;color:var(--ink);}
.audio-controls button.primary{background:var(--accent);color:#fff;border-color:var(--accent);}

.loading{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);font-family:'Open Sans',sans-serif;padding:14px 0;}
.spinner{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.error-box{background:var(--red-soft);color:#5c1420;border-radius:9px;padding:11px 13px;font-size:13px;margin:8px 0;}
.score-box{text-align:center;padding:14px 0;}
.score-box .num{font-family:'Open Sans',sans-serif;font-size:32px;font-weight:700;}

/* mission steps */
.mission-steps{display:flex;gap:5px;margin-bottom:16px;}
.mission-steps span{flex:1;height:4px;border-radius:2px;background:var(--line);}
.mission-steps span.done{background:var(--gold-strong);}
.mission-steps span.active{background:var(--accent);}
.mission-check{text-align:center;padding:8px 0;font-size:13px;color:var(--green);font-family:'Open Sans',sans-serif;}

/* dashboard */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;box-shadow:var(--shadow);}
.stat-card .num{font-family:'Open Sans',sans-serif;font-size:24px;font-weight:700;}
.stat-card .lbl{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0 4px;}
.cal-cell{aspect-ratio:1;border-radius:4px;background:var(--paper-2);}
.cal-cell.l1{background:#cfe3d2;}
.cal-cell.l2{background:#8fc79a;}
.cal-cell.l3{background:var(--green);}
.cal-legend{display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--ink-soft);justify-content:flex-end;font-family:'Open Sans',sans-serif;}
.skill-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.skill-bar-row .lbl{width:70px;font-size:12.5px;flex-shrink:0;}
.skill-bar-track{flex:1;height:8px;background:var(--paper-2);border-radius:4px;overflow:hidden;}
.skill-bar-fill{height:100%;border-radius:4px;}
.skill-bar-row .val{width:52px;text-align:right;font-family:'Open Sans',sans-serif;font-size:11px;color:var(--ink-soft);flex-shrink:0;}

/* ---------- Responsive: this is a daily-use app, phone-first ---------- */
#app{padding-left:max(16px, env(safe-area-inset-left));padding-right:max(16px, env(safe-area-inset-right));padding-bottom:max(48px, env(safe-area-inset-bottom));}
.pill{min-height:38px;display:inline-flex;align-items:center;}
.opt{min-height:44px;display:flex;align-items:center;}
.btn, .mission-hero button{min-height:46px;}
.icon-btn{min-height:34px;min-width:34px;display:flex;align-items:center;justify-content:center;}
@media (max-width:400px){
  #app{padding-left:14px;padding-right:14px;}
  .brand-title{font-size:14.5px;}
  .board-name{font-size:15.5px;}
  .board-emoji{font-size:24px;min-width:28px;}
  .mission-hero h2{font-size:18px;}
  .level-pill{padding:6px 9px;font-size:11.5px;}
  .stat-card .num{font-size:21px;}
  .header-right{align-items:flex-start;}
}
@media (max-width:340px){
  .header-icons{flex-wrap:wrap;justify-content:flex-end;}
  .streak{font-size:10.5px;}
}
</style>
</head>
<body>
<div id="auth-gate" class="auth-gate">
  <div class="auth-card">
    <svg width="48" height="48" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" style="border-radius:12px;margin-bottom:14px;">
      <rect width="64" height="64" rx="14" fill="#17150F"/>
      <path d="M18 33 L28 43 L47 20" fill="none" stroke="#FFCB3D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="auth-title">DEUTSCH ROUTINE</div>
    <div class="auth-sub">이메일로 로그인하고 학습 기록을 저장하세요</div>
    <input id="auth-email" type="email" placeholder="you@email.com" autocomplete="email"/>
    <button id="auth-send-btn">로그인 링크 받기</button>
    <div id="auth-status"></div>
  </div>
</div>
<div id="app">
  <header>
    <div style="display:flex;align-items:center;gap:10px;">
      <svg width="38" height="38" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0;border-radius:9px;">
        <rect width="64" height="64" rx="14" fill="#17150F"/>
        <path d="M18 33 L28 43 L47 20" fill="none" stroke="#FFCB3D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <div class="brand-title">DEUTSCH ROUTINE</div>
        <div class="brand-sub">매일 하는 독일어</div>
      </div>
    </div>
    <div class="header-right">
      <div class="header-icons">
        <div class="lang-toggle">
          <button id="lang-ko" class="active">KO</button>
          <button id="lang-de">DE</button>
        </div>
        <button class="icon-btn" id="dash-btn" title="Dashboard">📊</button>
      </div>
      <div class="streak" id="streak-label">🔥 <b>0</b>일</div>
    </div>
  </header>

  <div class="level-row" id="level-row"></div>

  <div id="home-view">
    <div class="mission-hero" id="mission-hero"></div>
    <div class="board">
      <div class="board-caption" id="board-caption">MODULE WÄHLEN</div>
      <div id="board-rows"></div>
    </div>
  </div>

  <div id="module-root"></div>
  <div id="dashboard-root"></div>
</div>

<script>
/* ============ Global state ============ */
let uiLang = 'ko';
let currentLevel = 'B1';
let progress = { streakDays:0, longestStreak:0, lastActiveDate:null, completedToday:[], activityLog:{}, stats:{} };
let currentModule = null;
let voicesReady = false;
let germanVoice = null;

const MODULES = [
  { id:'sprechen', no:'01', emoji:'🗣️', ko:'말하기', de:'SPRECHEN', accent:'var(--gold-strong)', accentSoft:'var(--gold-soft)' },
  { id:'schreiben', no:'02', emoji:'✍️', ko:'쓰기', de:'SCHREIBEN', accent:'var(--gold-strong)', accentSoft:'var(--gold-soft)' },
  { id:'hoeren', no:'03', emoji:'🎧', ko:'듣기', de:'HÖREN', accent:'var(--gold-strong)', accentSoft:'var(--gold-soft)' },
  { id:'lesen', no:'04', emoji:'📖', ko:'읽기', de:'LESEN', accent:'var(--gold-strong)', accentSoft:'var(--gold-soft)' }
];

const LEVELS = ['A1','A2','B1','B2','C1','C2'];
const LEVEL_META = {
  A1:{ ko:'입문', de:'Anfänger', hoerenWords:'40-60', lesenWords:'60-90', rate:0.85, tip:'Nur Präsens, sehr einfache Hauptsätze, Grundwortschatz (Familie, Alltag, Zahlen). Erkläre auf Koreanisch, wenn nötig.' },
  A2:{ ko:'초급', de:'Grundlegend', hoerenWords:'60-90', lesenWords:'90-120', rate:0.9, tip:'Präsens und Perfekt, einfache Verbindungen (und, aber, weil), Alltagsthemen.' },
  B1:{ ko:'중급', de:'Fortgeschritten I', hoerenWords:'90-120', lesenWords:'120-160', rate:0.95, tip:'Vergangenheitsformen, Meinungsäußerung, gängige Konnektoren (deshalb, obwohl, trotzdem).' },
  B2:{ ko:'중상급', de:'Selbstständig', hoerenWords:'110-150', lesenWords:'150-190', rate:1.0, tip:'Komplexere Satzstrukturen, Konjunktiv II, abstraktere Themen.' },
  C1:{ ko:'고급', de:'Fachkundig', hoerenWords:'120-160', lesenWords:'180-220', rate:1.0, tip:'Gehobener Wortschatz, Nominalstil, komplexe Argumentation.' },
  C2:{ ko:'최상급', de:'Nahezu muttersprachlich', hoerenWords:'140-180', lesenWords:'200-260', rate:1.05, tip:'Idiomatische Wendungen, Subtext/Ironie, sehr komplexe Syntax.' }
};

const TOPICS = [
  { ko:'기후 위기와 책임', de:'Klimawandel und Verantwortung' },
  { ko:'직장 내 디지털 전환', de:'Digitalisierung am Arbeitsplatz' },
  { ko:'이주와 사회통합', de:'Migration und Integration' },
  { ko:'인공지능과 윤리', de:'Künstliche Intelligenz und Ethik' },
  { ko:'SNS와 표현의 자유', de:'Redefreiheit in sozialen Medien' },
  { ko:'소비주의와 지속가능성', de:'Konsum und Nachhaltigkeit' }
];
const SMALLTALK_TOPICS = [
  { ko:'주말에 뭐 했는지', de:'Was hast du am Wochenende gemacht?' },
  { ko:'요즘 빠진 취미', de:'Ein Hobby, das dich gerade beschäftigt' },

/* ============ Storage (Supabase) ============ */
async function loadProgress(){
  try{
    const { data, error } = await sb.from('progress').select('data').eq('user_id', currentUser.id).single();
    if(data && data.data){
      progress = Object.assign({ streakDays:0, longestStreak:0, lastActiveDate:null, completedToday:[], activityLog:{}, stats:{} }, data.data);
    }
  }catch(e){ /* no saved progress yet */ }
  if(progress.level) currentLevel = progress.level;
  renderHeader();
  renderLevelRow();
}
async function saveProgress(){
  progress.level = currentLevel;
  try{
    await sb.from('progress').upsert({ user_id: currentUser.id, data: progress, updated_at: new Date().toISOString() });
  }catch(e){ console.error(e); }
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function bumpStat(skill, extra){
  if(!progress.stats[skill]) progress.stats[skill] = { count:0, scoreSum:0, scoreMax:0 };
  progress.stats[skill].count++;
  if(extra){ progress.stats[skill].scoreSum += (extra.score||0); progress.stats[skill].scoreMax += (extra.max||0); }
}
function markModuleDone(id, statExtra){
  const today = todayStr();
  if(progress.lastActiveDate !== today){
    const y = new Date(Date.now()-86400000).toISOString().slice(0,10);
    progress.streakDays = (progress.lastActiveDate === y) ? (progress.streakDays||0)+1 : 1;
    progress.longestStreak = Math.max(progress.longestStreak||0, progress.streakDays);
    progress.lastActiveDate = today;
    progress.completedToday = [];
  }
  if(!progress.completedToday.includes(id)) progress.completedToday.push(id);
  if(!progress.activityLog[today]) progress.activityLog[today] = [];
  if(!progress.activityLog[today].includes(id)) progress.activityLog[today].push(id);
  bumpStat(id, statExtra);
  saveProgress();
  renderHeader();
  renderHome();
}

/* ============ Claude API ============ */
async function callClaude(system, messages){
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ model:'claude-sonnet-4-6', max_tokens:1000, system, messages })
  });
  if(!res.ok) throw new Error('API error ' + res.status);
  const data = await res.json();
  return (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
}
const DAILY_PROMPT_MAP = {
  smalltalk: 'lockere Alltags-Small-Talk-Themen',
  issue: 'gesellschaftlich relevante Diskussionsthemen für ein anspruchsvolles Gespräch',
  academic: 'Themen aus Public History, Kunstgeschichte, Kulturerbe und Museumswissenschaft, passend für ein Studienfach in diesem Bereich'
};
async function getDailyTopics(kind, forceRefresh){
  const key = 'daily-'+kind+'-'+currentLevel+'-'+todayStr();
  if(!forceRefresh){
    try{
      const raw = localStorage.getItem(key);
      if(raw) return JSON.parse(raw);
    }catch(e){ /* not cached yet */ }
  }
  const system = 'Erstelle genau 3 abwechslungsreiche, konkrete Themenvorschläge ('+DAILY_PROMPT_MAP[kind]+') passend für Niveau '+currentLevel+'. Vermeide generische Standardthemen. '
    + 'Antworte AUSSCHLIESSLICH mit validem JSON, keine Backticks: [{"de":"<Thema auf Deutsch, kurz>","ko":"<gleiches Thema auf Koreanisch>"}]';
  const raw = await callClaude(system, [{role:'user', content:'Themen für den '+todayStr()+' generieren.'}]);
  const parsed = parseJSON(raw);
  if(parsed){ try{ localStorage.setItem(key, JSON.stringify(parsed)); }catch(e){} }
  return parsed;
}
function parseJSON(text){
  let s = (text||'').trim();
  s = s.replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  try{ return JSON.parse(s); }catch(e){ console.error('JSON parse failed', e, s); return null; }
}

function speakGerman(text, onend){
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'de-DE';
    if(germanVoice) u.voice = germanVoice;
    u.rate = lvl().rate;
    if(onend) u.onend = onend;
    window.speechSynthesis.speak(u);
  }catch(e){ console.error(e); }
}
function getRecognition(){
  const Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!Ctor) return null;
  const r = new Ctor();
  r.lang = 'de-DE';
  r.interimResults = false;
  r.maxAlternatives = 1;
  return r;
}

  const rec = getRecognition();
  if(!rec){
    document.getElementById('mic-warning').innerHTML = '<div class="error-box">'+t('micUnsupported')+'</div>';
    btn.disabled = true;
    return;
  }
  let recording = false;
  btn.addEventListener('click', ()=>{
    if(recording){ rec.stop(); return; }
    try{ rec.start(); recording = true; btn.classList.add('recording'); label.textContent = t('recording'); }
    catch(e){ console.error(e); }
  });
  rec.onresult = (ev)=>{
    const transcript = ev.results[0][0].transcript;
    sendSprechenTurn(transcript);
  };
  rec.onend = ()=>{ recording=false; btn.classList.remove('recording'); label.textContent = t('micHold'); };
  rec.onerror = ()=>{ recording=false; btn.classList.remove('recording'); label.textContent = t('micHold'); };
}
async function sendSprechenTurn(userText, isOpener){
  const log = document.getElementById('chat-log');
  if(!isOpener){
    const b = document.createElement('div');
    b.className='bubble user'; b.textContent = userText;
    log.appendChild(b);
  }
  document.getElementById('chat-loading').innerHTML = '<div class="loading"><div class="spinner"></div>'+t('loading')+'</div>';
  const feedbackLang = uiLang==='ko' ? 'Koreanisch' : 'Deutsch';
  const system = 'Du bist ein deutscher Konversationspartner für einen Deutschlerner auf Niveau '+currentLevel+' ('+lvl().de+'). '+lvl().tip+' Thema: "'+sprechState.topic.de+'". '
    + 'Antworte AUSSCHLIESSLICH mit einem validen JSON-Objekt, keine Backticks, kein weiterer Text: '
    + '{"reply": "<natürliche, dem Niveau entsprechende Antwort auf Deutsch, 2-4 Sätze, die auch eine Rückfrage an den Lerner enthält>", '
    + '"correction": "<falls die letzte Nutzeräußerung sprachliche Fehler enthielt: 1-3 kurze, konkrete, niveaugerechte Korrekturhinweise auf '+feedbackLang+'; sonst null>"}';
  sprechState.history.push({role:'user', content:userText});
  try{
    const raw = await callClaude(system, sprechState.history);
    const parsed = parseJSON(raw);
    document.getElementById('chat-loading').innerHTML = '';
    if(!parsed){ throw new Error('parse failed'); }
    sprechState.history.push({role:'assistant', content: raw});
    if(parsed.correction){
      const c = document.createElement('div');
      c.className='correction-note'; c.textContent = '💡 '+parsed.correction;
      log.appendChild(c);
    }
    const b = document.createElement('div');
    b.className='bubble ai';
    b.innerHTML = escapeHtml(parsed.reply) + '<button class="replay-btn">↺ '+t('play')+'</button>';
    b.querySelector('.replay-btn').addEventListener('click', ()=> speakGerman(parsed.reply));
    log.appendChild(b);
    log.scrollTop = log.scrollHeight;
    speakGerman(parsed.reply);
    sprechState.turns++;
    if(sprechState.turns>=2) markModuleDone('sprechen');
  }catch(e){
    document.getElementById('chat-loading').innerHTML = '<div class="error-box">'+t('error')+'</div>';
  }
}

      opt.classList.add('picked');
      hoerState.answers[qi] = parseInt(opt.dataset.o);

  document.getElementById('grade-hoer-btn').addEventListener('click', ()=>{
    hoerState.graded = true;
    let score = 0;
    d.questions.forEach((q,qi)=>{

      qa.querySelectorAll('.opt[data-q="'+qi+'"]').forEach(o=>{

      qa.querySelectorAll('.opt[data-q="'+qi+'"]').forEach(o=>o.classList.remove('picked'));
      opt.classList.add('picked');
      lesenState.answers[qi] = parseInt(opt.dataset.o);
    });
  });
  document.getElementById('grade-lesen-btn').addEventListener('click', ()=>{
    lesenState.graded = true;
    let score = 0;
    d.questions.forEach((q,qi)=>{
      const picked = lesenState.answers[qi];
      if(picked===q.answer) score++;
      qa.querySelectorAll('.opt[data-q="'+qi+'"]').forEach(o=>{
        const oi = parseInt(o.dataset.o);
        if(oi===q.answer) o.classList.add('correct');
        else if(oi===picked) o.classList.add('wrong');
      });
    });
    document.getElementById('lesen-score').innerHTML = '<div class="score-box"><div class="num">'+score+'/'+d.questions.length+'</div><div>'+t('score')+'</div></div>';
    markModuleDone('lesen', { score:score, max:d.questions.length });
  });
}

/* ============ TAGESMISSION ============ */
let missionState = { data:null, step:0, done:{hoeren:false,lesen:false,schreiben:false,sprechen:false,vocab:false} };
async function openMission(){
  currentModule = 'mission';
  hideHome();
  const root = document.getElementById('module-root');
  root.style.setProperty('--accent', 'var(--gold-strong)');
  root.style.setProperty('--accent-soft', 'var(--gold-soft)');
  root.innerHTML = '<div class="module active"><div class="module-header"><button class="back-btn" id="back-btn">'+t('back')+'</button>'
    + '<div class="module-title">'+t('missionTitle')+'</div></div>'
    + '<div class="mission-steps" id="mission-steps"></div>'
    + '<div id="mission-body"><div class="loading"><div class="spinner"></div>'+t('loading')+'</div></div></div>';
  document.getElementById('back-btn').addEventListener('click', showHome);
  const key = 'mission-'+currentLevel+'-'+todayStr();
  let data = null;
  try{
    const raw = localStorage.getItem(key);
    if(raw) data = JSON.parse(raw);
  }catch(e){ /* not cached */ }
  if(!data){
    const system = 'Erstelle eine kurze Tagesmission für einen Deutschlerner auf Niveau '+currentLevel+' ('+lvl().tip+') mit genau 5 sehr kurzen Aufgaben, eine pro Fertigkeit. '
      + 'Antworte AUSSCHLIESSLICH mit validem JSON, keine Backticks: {'
      + '"hoeren": {"script": "<1-2 kurze, sprechbare Sätze>", "question": "<Verständnisfrage>", "options": ["a","b","c"], "answer": <0-2>}, '
      + '"lesen": {"text": "<2-3 kurze Sätze>", "question": "<Verständnisfrage>", "options": ["a","b","c"], "answer": <0-2>}, '
      + '"schreiben": {"prompt": "<sehr kurze Schreibaufgabe, 1-2 Satz Antwort erwartet>"}, '
      + '"sprechen": {"prompt": "<eine einfache Frage zum lauten Beantworten>"}, '
      + '"vocab": {"word": "<ein nützliches Wort passend zum Niveau>", "example": "<Beispielsatz auf Deutsch>", "question": "Was bedeutet dieses Wort?", "options": ["a","b","c"], "answer": <0-2>}'
      + '}';
    try{
      const raw = await callClaude(system, [{role:'user', content:'Tagesmission für '+todayStr()+' generieren.'}]);
      data = parseJSON(raw);
      if(data){ try{ localStorage.setItem(key, JSON.stringify(data)); }catch(e){} }
    }catch(e){ /* handled below */ }
  }
  if(!data){
    document.getElementById('mission-body').innerHTML = '<div class="error-box">'+t('error')+'</div>';
    return;
  }
  missionState = { data, step:0, done:{hoeren:false,lesen:false,schreiben:false,sprechen:false,vocab:false} };
  const doneToday = (progress.activityLog[todayStr()]||[]).includes('mission');
  if(doneToday){ Object.keys(missionState.done).forEach(k=>missionState.done[k]=true); }
  renderMissionStep();
}
function renderMissionSteps(){
  const order = ['hoeren','lesen','schreiben','sprechen','vocab'];
  const bar = document.getElementById('mission-steps');
  bar.innerHTML = order.map((k,i)=>{
    let cls = '';
    if(missionState.done[k]) cls='done'; else if(i===missionState.step) cls='active';
    return '<span class="'+cls+'"></span>';
  }).join('');
}
function renderMissionStep(){
  renderMissionSteps();
  const order = ['hoeren','lesen','schreiben','sprechen','vocab'];
  const body = document.getElementById('mission-body');
  if(missionState.step >= order.length){
    body.innerHTML = '<div class="card mission-check">✓ '+t('missionFinish')+'</div>';
    if(!(progress.activityLog[todayStr()]||[]).includes('mission')) markModuleDone('mission');
    return;
  }
  const key = order[missionState.step];
  const d = missionState.data[key];
  if(key==='hoeren'){
    body.innerHTML = '<div class="card"><div class="section-label">01 · HÖREN</div>'
      + '<div class="audio-controls"><button class="primary" id="m-play">'+t('play')+'</button></div>'
      + '<div class="qa"><div class="q-block"><div class="q-text">'+escapeHtml(d.question)+'</div>'
      + d.options.map((o,oi)=>'<div class="opt" data-o="'+oi+'">'+escapeHtml(o)+'</div>').join('')+'</div></div>'
      + '<button class="btn" id="m-next" disabled>'+t('missionNext')+'</button></div>';
    document.getElementById('m-play').addEventListener('click', ()=> speakGerman(d.script));
    let picked = null;
    body.querySelectorAll('.opt').forEach(o=>o.addEventListener('click', ()=>{
      body.querySelectorAll('.opt').forEach(x=>x.classList.remove('picked'));
      o.classList.add('picked'); picked = parseInt(o.dataset.o);
      document.getElementById('m-next').disabled = false;
    }));
    document.getElementById('m-next').addEventListener('click', ()=>{
      body.querySelectorAll('.opt').forEach(o=>{
        const oi=parseInt(o.dataset.o);
        if(oi===d.answer) o.classList.add('correct'); else if(oi===picked) o.classList.add('wrong');
      });
      missionState.done.hoeren = true;
      setTimeout(()=>{ missionState.step++; renderMissionStep(); }, 700);
    });
  } else if(key==='lesen'){
    body.innerHTML = '<div class="card"><div class="section-label">02 · LESEN</div>'
      + '<div class="passage" style="margin-bottom:12px;">'+escapeHtml(d.text)+'</div>'
      + '<div class="qa"><div class="q-block"><div class="q-text">'+escapeHtml(d.question)+'</div>'
      + d.options.map((o,oi)=>'<div class="opt" data-o="'+oi+'">'+escapeHtml(o)+'</div>').join('')+'</div></div>'
      + '<button class="btn" id="m-next" disabled>'+t('missionNext')+'</button></div>';
    let picked = null;
    body.querySelectorAll('.opt').forEach(o=>o.addEventListener('click', ()=>{
      body.querySelectorAll('.opt').forEach(x=>x.classList.remove('picked'));
      o.classList.add('picked'); picked = parseInt(o.dataset.o);
      document.getElementById('m-next').disabled = false;
    }));
    document.getElementById('m-next').addEventListener('click', ()=>{
      body.querySelectorAll('.opt').forEach(o=>{
        const oi=parseInt(o.dataset.o);
        if(oi===d.answer) o.classList.add('correct'); else if(oi===picked) o.classList.add('wrong');
      });
      missionState.done.lesen = true;
      setTimeout(()=>{ missionState.step++; renderMissionStep(); }, 700);
    });
  } else if(key==='schreiben'){
    body.innerHTML = '<div class="card"><div class="section-label">03 · SCHREIBEN</div>'
      + '<div style="font-weight:600;font-size:14.5px;margin-bottom:10px;">'+escapeHtml(d.prompt)+'</div>'
      + '<textarea class="write-area" id="m-write" style="min-height:70px;" placeholder="'+t('yourAnswer')+'"></textarea>'
      + '<button class="btn" id="m-submit" style="margin-top:10px;">'+t('missionSubmit')+'</button>'
      + '<div id="m-fb"></div></div>';
    document.getElementById('m-submit').addEventListener('click', async ()=>{
      const val = document.getElementById('m-write').value.trim();
      if(!val) return;
      const fbEl = document.getElementById('m-fb');
      fbEl.innerHTML = '<div class="loading"><div class="spinner"></div>'+t('loading')+'</div>';
      const feedbackLang = uiLang==='ko' ? 'Koreanisch' : 'Deutsch';
      const system = 'Der Lerner (Niveau '+currentLevel+') hat auf die Aufgabe "'+d.prompt+'" geantwortet. Gib EINE sehr kurze, ermutigende Rückmeldung (1-2 Sätze auf '+feedbackLang+') mit dem wichtigsten Verbesserungstipp, falls nötig. Antworte NUR mit JSON: {"feedback":"..."}';
      try{
        const raw = await callClaude(system, [{role:'user', content:val}]);
        const parsed = parseJSON(raw);
        fbEl.innerHTML = '<div class="correction-note" style="margin-top:8px;">💡 '+escapeHtml(parsed?parsed.feedback:'')+'</div>'
          + '<button class="btn" id="m-next" style="margin-top:10px;">'+t('missionNext')+'</button>';
        document.getElementById('m-next').addEventListener('click', ()=>{ missionState.done.schreiben=true; missionState.step++; renderMissionStep(); });
      }catch(e){
        missionState.done.schreiben=true; missionState.step++; renderMissionStep();
      }
    });
  } else if(key==='sprechen'){
    body.innerHTML = '<div class="card"><div class="section-label">04 · SPRECHEN</div>'
      + '<div style="font-weight:600;font-size:14.5px;margin-bottom:6px;">'+escapeHtml(d.prompt)+'</div>'
      + '<div style="font-size:12px;color:var(--ink-soft);margin-bottom:10px;">'+t('missionSpeak')+'</div>'
      + '<div class="mic-zone"><button class="mic-btn" id="m-mic">🎙️</button><div class="mic-label" id="m-mic-label">'+t('micHold')+'</div></div>'
      + '<div class="text-fallback"><input id="m-text-input" placeholder="'+t('typeFallback')+'"/><button id="m-text-send">'+t('send')+'</button></div>'
      + '<div id="m-sprech-fb"></div></div>';
    const finishSprechen = async (val)=>{
      const fbEl = document.getElementById('m-sprech-fb');
      fbEl.innerHTML = '<div class="loading"><div class="spinner"></div>'+t('loading')+'</div>';
      const feedbackLang = uiLang==='ko' ? 'Koreanisch' : 'Deutsch';
      const system = 'Der Lerner (Niveau '+currentLevel+') hat auf die mündliche Frage "'+d.prompt+'" geantwortet. Gib EINE sehr kurze, ermutigende Rückmeldung (1-2 Sätze auf '+feedbackLang+'). Antworte NUR mit JSON: {"feedback":"..."}';
      try{
        const raw = await callClaude(system, [{role:'user', content:val}]);
        const parsed = parseJSON(raw);
        fbEl.innerHTML = '<div class="correction-note" style="margin-top:8px;">💡 '+escapeHtml(parsed?parsed.feedback:'')+'</div>'
          + '<button class="btn" id="m-next" style="margin-top:10px;">'+t('missionNext')+'</button>';
        document.getElementById('m-next').addEventListener('click', ()=>{ missionState.done.sprechen=true; missionState.step++; renderMissionStep(); });
      }catch(e){
        missionState.done.sprechen=true; missionState.step++; renderMissionStep();
      }
    };
    const rec = getRecognition();
    if(rec){
      let recording=false;
      const btn = document.getElementById('m-mic'), label = document.getElementById('m-mic-label');
      btn.addEventListener('click', ()=>{
        if(recording){ rec.stop(); return; }
        try{ rec.start(); recording=true; btn.classList.add('recording'); label.textContent=t('recording'); }catch(e){}
      });
      rec.onresult = (ev)=> finishSprechen(ev.results[0][0].transcript);
      rec.onend = ()=>{ recording=false; btn.classList.remove('recording'); label.textContent=t('micHold'); };
      rec.onerror = ()=>{ recording=false; btn.classList.remove('recording'); label.textContent=t('micHold'); };
    } else {
      document.getElementById('m-mic').disabled = true;
      document.getElementById('m-mic-label').textContent = t('micUnsupported');
    }
    document.getElementById('m-text-send').addEventListener('click', ()=>{
      const v = document.getElementById('m-text-input').value.trim();
      if(v) finishSprechen(v);
    });
  } else if(key==='vocab'){
    body.innerHTML = '<div class="card"><div class="section-label">05 · WORTSCHATZ</div>'
      + '<div style="font-family:\'Open Sans\',sans-serif;font-size:20px;font-weight:600;margin-bottom:8px;">'+escapeHtml(d.word)+'</div>'
      + '<div class="passage" style="font-size:14px;margin-bottom:12px;">'+escapeHtml(d.example)+'</div>'
      + '<div class="qa"><div class="q-block"><div class="q-text">'+escapeHtml(d.question)+'</div>'
      + d.options.map((o,oi)=>'<div class="opt" data-o="'+oi+'">'+escapeHtml(o)+'</div>').join('')+'</div></div>'
      + '<button class="btn" id="m-next" disabled>'+t('missionFinish')+'</button></div>';
    let picked = null;
    body.querySelectorAll('.opt').forEach(o=>o.addEventListener('click', ()=>{
      body.querySelectorAll('.opt').forEach(x=>x.classList.remove('picked'));
      o.classList.add('picked'); picked = parseInt(o.dataset.o);
      document.getElementById('m-next').disabled = false;
    }));
    document.getElementById('m-next').addEventListener('click', ()=>{
      body.querySelectorAll('.opt').forEach(o=>{
        const oi=parseInt(o.dataset.o);
        if(oi===d.answer) o.classList.add('correct'); else if(oi===picked) o.classList.add('wrong');
      });
      missionState.done.vocab = true;
      setTimeout(()=>{ missionState.step++; renderMissionStep(); }, 700);
    });
  }
}

/* ============ DASHBOARD ============ */
function openDashboard(){
  hideHome();
  currentModule = null;
  const root = document.getElementById('dashboard-root');
  const totalSessions = Object.values(progress.stats||{}).reduce((a,s)=>a+(s.count||0),0);
  root.innerHTML = '<div class="module active"><div class="module-header"><button class="back-btn" id="back-btn">'+t('back')+'</button>'
    + '<div class="module-title">'+t('dashTitle')+'</div></div>'
    + '<div class="stat-grid">'
    + statCard(progress.streakDays||0, t('dashStreak'))
    + statCard(progress.longestStreak||0, t('dashLongest'))
    + statCard(currentLevel, t('dashLevel'))
    + statCard(totalSessions, t('dashSessions'))
    + '</div>'
    + '<div class="card"><div class="section-label" style="display:flex;justify-content:space-between;">'+t('dashCalendar')+'<span class="cal-legend">'+t('less')+' <span class="cal-cell" style="width:9px;height:9px;display:inline-block;"></span><span class="cal-cell l1" style="width:9px;height:9px;display:inline-block;"></span><span class="cal-cell l2" style="width:9px;height:9px;display:inline-block;"></span><span class="cal-cell l3" style="width:9px;height:9px;display:inline-block;"></span> '+t('more')+'</span></div>'
    + '<div class="cal-grid" id="cal-grid"></div></div>'
    + '<div class="card"><div class="section-label">'+t('dashSkills')+'</div><div id="skill-bars"></div></div>'
    + '<div class="card"><div class="section-label">계정</div><div style="font-size:13px;color:var(--ink-soft);margin-bottom:10px;">'+(currentUser?currentUser.email:'')+'</div><button class="logout-btn" id="logout-btn">로그아웃</button></div>'
    + '</div>';
  document.getElementById('back-btn').addEventListener('click', showHome);
  document.getElementById('logout-btn').addEventListener('click', signOut);
  renderCalendar();
  renderSkillBars();
}
function statCard(num, lbl){ return '<div class="stat-card"><div class="num">'+num+'</div><div class="lbl">'+lbl+'</div></div>'; }
function renderCalendar(){
  const grid = document.getElementById('cal-grid');
  const days = 35;
  let html = '';
  for(let i=days-1;i>=0;i--){
    const d = new Date(Date.now() - i*86400000);
    const key = d.toISOString().slice(0,10);
    const count = (progress.activityLog[key]||[]).length;
    let cls = '';
    if(count>=3) cls='l3'; else if(count===2) cls='l2'; else if(count===1) cls='l1';
    html += '<div class="cal-cell '+cls+'" title="'+key+': '+count+'"></div>';
  }
  grid.innerHTML = html;
}
function renderSkillBars(){
  const wrap = document.getElementById('skill-bars');
  const skills = [
    { id:'sprechen', label: uiLang==='ko'?'말하기':'Sprechen', color:'var(--gold-strong)' },
    { id:'schreiben', label: uiLang==='ko'?'쓰기':'Schreiben', color:'var(--gold-strong)' },
    { id:'hoeren', label: uiLang==='ko'?'듣기':'Hören', color:'var(--gold-strong)' },
    { id:'lesen', label: uiLang==='ko'?'읽기':'Lesen', color:'var(--gold-strong)' },
    { id:'mission', label: uiLang==='ko'?'미션':'Mission', color:'var(--gold-strong)' }
  ];
  const maxCount = Math.max(1, ...skills.map(s => (progress.stats[s.id]||{}).count||0));
  wrap.innerHTML = skills.map(s=>{
    const st = progress.stats[s.id]||{count:0};
    const pct = Math.round(((st.count||0)/maxCount)*100);
    let valTxt = st.count + 'x';
    if(st.scoreMax){ valTxt += ' · ' + Math.round((st.scoreSum/st.scoreMax)*100) + '%'; }
    return '<div class="skill-bar-row"><div class="lbl">'+s.label+'</div>'
      + '<div class="skill-bar-track"><div class="skill-bar-fill" style="width:'+pct+'%;background:'+s.color+';"></div></div>'
      + '<div class="val">'+valTxt+'</div></div>';
  }).join('');
}

async function initAuth(){
  const { data:{ session } } = await sb.auth.getSession();
  if(session){ currentUser = session.user; onAuthed(); }
  else{ showAuthGate(); }
  sb.auth.onAuthStateChange((event, session)=>{
    if(session && (!currentUser || currentUser.id !== session.user.id)){
      currentUser = session.user;
      onAuthed();
    } else if(!session){
      currentUser = null;
      showAuthGate();
    }
  });
